version: "2"

linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: error-strings
        - name: superfluous-else
        - name: var-naming

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/caitunai/appnet
